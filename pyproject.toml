[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP045"]  # Pydantic evaluates annotations at runtime on Python 3.9.

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"
files = ["src"]
